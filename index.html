<style>
/* Next Level app (Netlify + Supabase). Layout: five tabs with More. Phone = top bar + one column + bottom tabs; desktop = left rail + column + right sidebar. Calm Home, details on tap, bells on rows. */
:root{
  --navy:#0B2033; --slate:#6385AB; --cream:#FEF8E6;
  --bg:#FBF6E9; --surface:#FFFFFF; --ink:#0B2033; --muted:#5A6C7E; --line:#ECE4CF; --soft:#F3ECDA;
  --accent:#3E6A99; --accent-soft:#E4ECF4; --hero:#0B2033; --hero-ink:#FEF8E6; --hero-muted:#BFD0E2;
  --good:#2F7D5B; --good-soft:#DFF0E7; --warn:#A8601A; --warn-soft:#F6E5CE; --bad:#A63B32;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081726; --surface:#0F243A; --ink:#F4EEDD; --muted:#A3B3C4; --line:#1D3349; --soft:#152D45;
  --accent:#8FB0D6; --accent-soft:#183451; --hero:#1A3B5C; --hero-ink:#FEF8E6; --hero-muted:#C2D3E5;
  --good:#6FC39C; --good-soft:#163A2C; --warn:#E5A65C; --warn-soft:#3A2A16; --bad:#E58A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081726; --surface:#0F243A; --ink:#F4EEDD; --muted:#A3B3C4; --line:#1D3349; --soft:#152D45;
  --accent:#8FB0D6; --accent-soft:#183451; --hero:#1A3B5C; --hero-ink:#FEF8E6; --hero-muted:#C2D3E5;
  --good:#6FC39C; --good-soft:#163A2C; --warn:#E5A65C; --warn-soft:#3A2A16; --bad:#E58A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5}
html{background:var(--bg)}
/* Phones: the screen itself never scrolls; only the content area does. Keeps the bottom bar fixed on iPhone Home Screen apps. */
@media (max-width:959px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  input,select,textarea{font-size:16px!important}
}
@media (max-width:959px){
  .shell{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px}

.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
@media (min-width:960px){.shell{grid-template-columns:220px minmax(0,1fr) 300px;max-width:1300px;margin:0 auto}}
.rail{display:none}
@media (min-width:960px){.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:28px 14px;border-right:1px solid var(--line)}}
.rail a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600}
.rail a[aria-current="page"]{background:var(--surface);color:var(--ink)}
.rail a svg{width:20px;height:20px}
.rail .rail-brand{margin-bottom:14px;color:var(--ink)}.rail .rail-brand b{font-family:var(--display);font-size:22px}
@media (min-width:960px){.topbar .logo{visibility:hidden}}
.side{display:none}

.nlist b{font-size:15px}.nlist p{margin:0;grid-column:1/-1;color:var(--muted);font-size:14px}.nlist small{color:var(--muted);font-size:12px;white-space:nowrap}.nlist a.new b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--slate);margin-right:8px;vertical-align:middle}

main{padding-block:6px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}

.col{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ph h1{font-size:36px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.st{font-family:var(--display);font-size:23px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.st a,.st button{font-family:var(--body);font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.sect{display:flex;flex-direction:column;gap:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
@media (min-width:960px){.tabs{display:none}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:5px 0}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke:var(--slate)}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .k{font-size:12.5px;color:var(--hero-muted);font-weight:600}

.hero .meta{color:var(--hero-muted);font-size:14px}
.hero .row{margin-top:10px}
.hero .more{background:none;border:0;color:var(--hero-muted);font-weight:600;font-size:13.5px;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;background:var(--slate);color:#fff;display:inline-flex;align-items:center;gap:7px}
.btn.on{background:var(--good)}
.btn.quiet{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:13px}

.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.rows{background:var(--surface);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.r{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;background:none;border:0;text-align:left;width:100%;color:inherit}
.r + .r{border-top:1px solid var(--line)}
@media (hover:hover){button.r:hover{background:var(--soft)}}
.dt{text-align:center;line-height:1.05}

.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none;overflow:hidden}
.av img{width:100%;height:100%}
.post p{margin:0;font-size:15px;white-space:pre-wrap}

/* colour coding: Next Level = gold dot, main church = blue square, birthdays = pink diamond */
:root{--c-nl:#B8862B;--c-ch:#2F6FC8;--c-bd:#C9407A}

<script>
/* Opening screen: the NL logo and a word of encouragement, once per visit */
(function(){
  var s=document.getElementById("splash");if(!s)return;
  var tpl=s.cloneNode(true);
  var seen=false;try{seen=sessionStorage.getItem("nl.splash")==="1"}catch(e){}
  window.NL_REPLAY_SPLASH=function(){var o=document.getElementById("splash");if(o)o.remove();var n=tpl.cloneNode(true);document.body.insertBefore(n,document.body.firstChild);run(n)};
  if(seen){s.remove();return}
  try{sessionStorage.setItem("nl.splash","1")}catch(e){}
  run(s);
  function run(s){
  var Q=[
    ["How good and pleasant it is when God's people live together in unity.","Psalm 133:1"],
    ["Two are better than one.","Ecclesiastes 4:9"],
    ["As iron sharpens iron, so one person sharpens another.","Proverbs 27:17"],
    ["Whoever wants to become great among you must be your servant.","Mark 10:43"],
    ["Let us rise up and build.","Nehemiah 2:18"],
    ["Let us not give up meeting together, but encourage one another.","Hebrews 10:25"],
    ["One body, many parts, one purpose.","1 Corinthians 12:12"],
    ["Better together. Stronger together.","Next Level"],
    ["Lead by serving. Serve with love.","Next Level"],
    ["Called higher. Going further. Together.","Next Level"]
  ];
  var q=Q[Math.floor(Math.random()*Q.length)];
  s.querySelector(".sp-q").textContent=q[0];s.querySelector(".sp-ref").textContent=q[1];
  var v=s.querySelector("video");
  var done=false;function hide(){if(done)return;done=true;s.classList.add("out");setTimeout(function(){s.remove()},600)}
  window.NL_SPLASH_HIDE=hide;
  // First open: the 4K film streams and starts as soon as the first part arrives (no waiting for the whole file).
  // Straight after it plays, the full file is saved on this phone, so every later open starts instantly from storage.
  var CACHE="nl-opening-v7",POSTER="op/v7-poster.jpg";
  var C=[["op/v7-2160-hevc.mp4",'video/mp4; codecs="hvc1.1.6.L153.B0"',16e6],["op/v7-2160-av1.mp4",'video/mp4; codecs="av01.0.12M.08"',19e6],["op/v7-2160-h264.mp4",'video/mp4; codecs="avc1.640033"',17e6]];
  var LOW="op/v7-1080-h264.mp4";
  var state="wait",chosen=null;
  function startStill(){if(state!=="wait")return;state="still";v.poster=POSTER;s.classList.add("still");setTimeout(hide,2200)}
  function startFilm(src){if(state!=="wait")return;
    v.addEventListener("playing",function(){if(state!=="wait")return;state="play";s.classList.add("play");setTimeout(hide,2450)},{once:true});
    v.addEventListener("error",function(){startStill()},{once:true});
    v.preload="auto";v.src=src;var p=v.play();if(p&&p.catch)p.catch(function(){startStill()})}
  function pick(cb){
    var list=C.slice(),mc=navigator.mediaCapabilities;
    (function next(){var c=list.shift();if(!c){cb(LOW);return}
      if(!v.canPlayType||!v.canPlayType(c[1])){next();return}
      if(!mc||!mc.decodingInfo){cb(c[0]);return}
      mc.decodingInfo({type:"file",video:{contentType:c[1],width:3840,height:2160,bitrate:c[2],framerate:30}}).then(function(r){if(r&&r.supported&&r.smooth)cb(c[0]);else next()},next)})();
  }
  function saveForNextTime(url){ // runs once the opening has finished, so it never slows the film down
    if(!window.caches)return;
    setTimeout(function(){caches.open(CACHE).then(function(c){return c.match(url).then(function(hit){if(hit)return;return fetch(url,{cache:"force-cache"}).then(function(r){if(r.ok)return c.put(url,r)})})}).catch(function(){})},2600);
  }
  try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf("nl-opening-")===0&&k!==CACHE)caches.delete(k)})})}catch(e){}
  setTimeout(startStill,2800);   // only if the film truly can't start (no signal, Low Power Mode) do we show the still instead
  pick(function(url){chosen=url;
    var fromNet=function(){startFilm(url);saveForNextTime(url)};
    if(!window.caches){fromNet();return}
    caches.open(CACHE).then(function(c){return c.match(url)}).then(function(hit){
      if(!hit){fromNet();return}
      return hit.blob().then(function(b){if(!b||!b.size){fromNet();return}startFilm(URL.createObjectURL(b))});
    }).catch(fromNet);
  });
  s.addEventListener("click",hide);
  }
})();
</script>

     padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));font-family:var(--body,system-ui,sans-serif)}
   #nl-gate[hidden]{display:none}
   #nl-gate .pw{position:relative;display:block}
   #nl-gate .pw input{padding-right:52px}
   #nl-gate button.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:0;border-radius:10px;background:transparent;color:var(--muted,#5A6C7E);display:grid;place-items:center}
   #nl-gate button.eye:focus-visible{outline:2px solid var(--slate,#6385AB);outline-offset:-2px}
   #nl-gate .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
   #nl-gate .mk{width:64px;height:64px;border-radius:18px;background:#0B2033 url(mark-128.png) center/cover no-repeat;color:transparent;font-size:0;box-shadow:0 6px 18px -8px rgba(11,32,51,.6)}
   #nl-gate h1{font-family:var(--display,Georgia,serif);font-size:38px;margin:0;line-height:1.05}
   #nl-gate p{margin:0;color:var(--muted,#5A6C7E);font-size:15px;line-height:1.5}
   #nl-gate label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted,#5A6C7E)}
   #nl-gate input{width:100%;border:1px solid var(--line,#E4DCC6);background:var(--surface,#fff);color:var(--ink,#0B2033);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}
   #nl-gate input.code{letter-spacing:.4em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
   #nl-gate button{border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;font-size:15px;background:var(--slate,#6385AB);color:#fff;cursor:pointer}
   #nl-gate button.quiet{background:transparent;color:var(--accent,#3E6A99);padding:6px 0;text-align:left}
   #nl-gate button.alt{background:var(--surface,#fff);color:var(--ink,#0B2033);border:1px solid var(--line,#E4DCC6)}
   #nl-gate button[disabled]{opacity:.6}
   #nl-gate .err{color:var(--bad,#A63B32);font-size:14px}
   #nl-gate .small{font-size:12.5px}
   #nl-gate a{color:var(--accent,#3E6A99)}
  </style><div class="box" id="nl-gate-box"></div>`;

  function showGate(html, onMount) {
    if (!gate.isConnected) document.body.appendChild(gate);
    gate.hidden = false;
    $("#nl-gate-box").innerHTML = `<div class="mk">NL</div>` + html;
    if (onMount) onMount($("#nl-gate-box"));
    const f = $("#nl-gate-box input"); if (f) setTimeout(() => f.focus(), 50);
  }
  function hideGate() { gate.hidden = true; }

  const LS = { get(k) { try { return localStorage.getItem("nl." + k) || ""; } catch (e) { return ""; } },
               set(k, v) { try { localStorage.setItem("nl." + k, v); } catch (e) {} } };

  // Members: name + community code. This phone stays signed in.
  function joinScreen(msg) {
    showGate(`<h1>Welcome to<br>Next Level</h1>
      <p>Enter your name and the community code. You'll stay signed in on this phone.</p>
      <form id="g-j" style="display:flex;flex-direction:column;gap:12px">
        <label for="g-name">Your name<input id="g-name" autocomplete="name" maxlength="60" required placeholder="First and last name" value="${esc(LS.get("name"))}"></label>
        <label for="g-code">Community code<input id="g-code" autocomplete="off" autocapitalize="characters" spellcheck="false" required placeholder="Ask a leader for this"></label>
        <button type="submit" id="g-go">Join</button>
        <p class="err" id="g-err" ${msg ? "" : "hidden"}>${esc(msg || "")}</p>
      </form>
      <button class="quiet" id="g-lead">Leader? Sign in with email</button>
      <p class="small"><a href="privacy.html">Privacy</a></p>`, box => {
      box.querySelector("#g-j").addEventListener("submit", async e => {
        e.preventDefault();
        const name = box.querySelector("#g-name").value.trim(), code = box.querySelector("#g-code").value;
        const btn = box.querySelector("#g-go"), err = box.querySelector("#g-err");
        const fail = m => { btn.disabled = false; btn.textContent = "Join"; err.hidden = false; err.textContent = m; };
        if (name.length < 2) return fail("Please enter your name.");
        btn.disabled = true; btn.textContent = "Joining…"; err.hidden = true; LS.set("name", name);
        try {
          let s = (await sb.auth.getSession()).data.session;
          if (s && !s.user.is_anonymous) { await sb.auth.signOut(); s = null; }
          if (!s) { const r = await sb.auth.signInAnonymously(); if (r.error) return fail("Couldn't connect. Check your internet and try again."); }
          let { data, error } = await sb.rpc("join_with_code", { p_code: code, p_name: name });
          if (data === "no_account") { // this phone was removed: start fresh
            await sb.auth.signOut(); await sb.auth.signInAnonymously();
            ({ data, error } = await sb.rpc("join_with_code", { p_code: code, p_name: name }));
          }
          if (error) return fail("Couldn't connect. Check your internet and try again.");
          if (data === "ok") { await boot(); return; }
          fail({ wrong: "That code isn't right. Check it with a leader.", locked: "Too many wrong tries on this phone. Ask a leader for help.", name: "Please enter your name." }[data] || "Something went wrong. Try again.");
        } catch (x) { fail("Couldn't connect. Check your internet and try again."); }
      });
      box.querySelector("#g-lead").addEventListener("click", () => leaderScreen());
    });
  }

  // Leaders: email + password
  function leaderScreen(msg) {
    showGate(`<h1>Leader sign-in</h1>
      <form id="g-l" style="display:flex;flex-direction:column;gap:12px">
        <label for="g-email">Email<input type="email" id="g-email" autocomplete="username" required></label>
        <label for="g-pw">Password<input type="password" id="g-pw" autocomplete="current-password" required></label>
        <button type="submit" id="g-go">Sign in</button>
        <p class="err" id="g-err" ${msg ? "" : "hidden"}>${esc(msg || "")}</p>
      </form>
      <button class="quiet" id="g-setup">First time? Set up your leader account</button>
      <p class="small">Forgotten your password? Ask an owner to reset your login. They'll give you a new setup code.</p>
      <button class="quiet" id="g-back">← Back to joining with the community code</button>`, box => {
      box.querySelector("#g-l").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = box.querySelector("#g-go"), err = box.querySelector("#g-err");
        btn.disabled = true; err.hidden = true;
        const { error } = await sb.auth.signInWithPassword({ email: box.querySelector("#g-email").value.trim(), password: box.querySelector("#g-pw").value });
        if (error) { btn.disabled = false; err.hidden = false; err.textContent = /fetch|network/i.test(error.message) ? "Couldn't connect. Check your internet." : "That email and password don't match."; return; }
        await boot();
      });
      box.querySelector("#g-setup").addEventListener("click", () => setupAccountScreen());
      box.querySelector("#g-back").addEventListener("click", () => joinScreen());
    });
  }

  // First-time leader setup with a one-time setup code
  function setupAccountScreen() {
    showGate(`<h1>Set up your<br>leader account</h1>
      <p>Use the email you were invited with and the setup code you were given.</p>
      <form id="g-s" style="display:flex;flex-direction:column;gap:12px">
        <label for="g-email">Email<input type="email" id="g-email" autocomplete="username" required></label>
        <label for="g-scode">Setup code<input id="g-scode" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <label for="g-pw">Choose a password<input type="password" id="g-pw" autocomplete="new-password" minlength="8" required></label>
        <button type="submit" id="g-go">Create my account</button>
        <p class="err" id="g-err" hidden></p>
      </form>
      <button class="quiet" id="g-back">← Back to sign in</button>`, box => {
      box.querySelector("#g-s").addEventListener("submit", async e => {
        e.preventDefault();
        const email = box.querySelector("#g-email").value.trim().toLowerCase(), code = box.querySelector("#g-scode").value, pw = box.querySelector("#g-pw").value;
        const btn = box.querySelector("#g-go"), err = box.querySelector("#g-err");
        const fail = m => { btn.disabled = false; err.hidden = false; err.textContent = m; };
        if (pw.length < 8) return fail("Use a password of at least 8 characters.");
        btn.disabled = true; err.hidden = true;
        const chk = await sb.rpc("check_setup_code", { p_email: email, p_code: code });
        if (chk.error) return fail("Couldn't connect. Check your internet and try again.");
        if (!chk.data) return fail("That email and setup code don't match. Check them with whoever invited you.");
        const cur = (await sb.auth.getSession()).data.session; if (cur) await sb.auth.signOut();
        const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { setup_code: code } } });
        if (error) return fail(/registered|exists/i.test(error.message) ? "This email already has an account. Sign in instead, or ask an owner to reset it." : "Couldn't create the account. Try again.");
        if (!data.session) { const r = await sb.auth.signInWithPassword({ email, password: pw }); if (r.error) return fail("Account created, but sign-in failed. Try signing in."); }
        await boot();
      });
      box.querySelector("#g-back").addEventListener("click", () => leaderScreen());
    });
  }

  function pendingScreen() {
    showGate(`<h1>Almost there</h1>
      <p>You're signed in as <b>${esc(session.user.email || "")}</b>, but this email hasn't been set up as a leader. If you're a member, join with the community code instead.</p>
      <button class="alt" id="g-check">Check again</button>
      <button class="quiet" id="g-out">Sign out</button>`, box => {
      box.querySelector("#g-check").addEventListener("click", () => boot());
      box.querySelector("#g-out").addEventListener("click", async () => { await sb.auth.signOut(); joinScreen(); });
    });
  }
  function setupScreen() {
    showGate(`<h1>Not connected yet</h1><p>This copy of the app has no database settings. Add your Supabase project URL and public key to <b>config.js</b>, then reload. The README explains how.</p>`);
  }
  const siteUrl = () => CFG.siteUrl || (location.origin + location.pathname);

  /* ---------- helpers ---------- */
  function mapErr(error) {
    if (!error) return null;
    const rls = error.code === "42501" || /row-level security|permission denied/i.test(error.message || "");
    return { code: rls ? "invalid_argument" : "unavailable", message: error.message };
  }
  const COLORS = ["#6385AB", "#B26A1C", "#2F7D5B", "#8A4F7D", "#3E6A99", "#A63B32", "#5B7A3A", "#7A5BA6"];
  function avatar(name, id) {
    const ini = String(name || "?").split(/[\s&]+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
    let h = 0; for (const c of String(id || name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="${COLORS[h % COLORS.length]}"/><text x="32" y="41" font-family="Figtree,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">${esc(ini)}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  const splitPath = p => { const i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 20);

  /* ---------- live data ---------- */
  const pcache = new Map(), pinflight = new Map(); // names, kept 5 minutes
  const listeners = {}; // collection -> Set of reload functions
  let channel = null;
  const timers = {};
  function poke(col) { (listeners[col] || []).forEach(fn => { clearTimeout(timers[fn.key]); timers[fn.key] = setTimeout(fn, 120); }); }
  function startRealtime() {
    if (channel) return;
    channel = sb.channel("nl-docs")
      .on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
        const col = (p.new && p.new.collection) || (p.old && p.old.collection);
        if (col) poke(col); else Object.keys(listeners).forEach(poke);
      })
      .subscribe();
    // catch up after the phone wakes up or the tab comes back
    document.addEventListener("visibilitychange", () => { if (!document.hidden) Object.keys(listeners).forEach(poke); });
    window.addEventListener("online", () => Object.keys(listeners).forEach(poke));
  }
  let keySeq = 0;
  function listen(col, fn) { fn.key = "k" + (++keySeq); (listeners[col] = listeners[col] || new Set()).add(fn); startRealtime(); fn(); return () => listeners[col].delete(fn); }

  const db = {
    collection(col) {
      return {
        onSnapshot(cb, onErr) {
          let prev = null, prevSig = null;
          return listen(col, async () => {
            const { data, error } = await sb.from("docs").select("id,data").eq("collection", col);
            if (error) { onErr && onErr(mapErr(error)); return; }
            const sig = JSON.stringify(data);
            if (sig === prevSig) return;
            prevSig = sig;
            const docs = data.map(r => ({ id: r.id, exists: true, data: () => r.data }));
            const added = prev ? docs.filter(d => !prev.has(d.id)) : [];
            prev = new Set(docs.map(d => d.id));
            cb({ docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false },
                 docChanges: () => added.map(d => ({ type: "added", doc: d })) });
          });
        },
        async add(data) { const id = newId(); await db.doc(col + "/" + id).set(data); return { id }; },
        doc(id) { return db.doc(col + "/" + id); }
      };
    },
    doc(path) {
      const [col, id] = splitPath(path);
      return {
        onSnapshot(cb, onErr) {
          let prevSig;
          return listen(col, async () => {
            const { data, error } = await sb.from("docs").select("data").eq("collection", col).eq("id", id).maybeSingle();
            if (error) { onErr && onErr(mapErr(error)); return; }
            const sig = JSON.stringify(data);
            if (sig === prevSig) return;
            prevSig = sig;
            cb({ exists: !!data, id, data: () => (data ? data.data : undefined), metadata: { fromCache: false, hasPendingWrites: false } });
          });
        },
        async set(data) {
          const { error } = await sb.from("docs").upsert({ collection: col, id, data });
          if (error) throw mapErr(error);
          poke(col);
        },
        async delete() {
          const { error } = await sb.from("docs").delete().eq("collection", col).eq("id", id);
          if (error) throw mapErr(error);
          poke(col);
        }
      };
    }
  };

  /* ---------- who's viewing ---------- */
  const isLeaderRole = r => r === "leader" || r === "owner";
  const user = {
    id: async () => session.user.id,
    canEdit: async () => isLeaderRole(profile.role),
    isOwner: () => profile.role === "owner",
    can: async () => ["member", "leader", "owner"].includes(profile.role),
    me: async () => ({ id: session.user.id, name: profile.name || "", avatarUrl: avatar(profile.name, session.user.id), isMe: true, guest: false }),
    profiles: async ids => {
      const list = [...new Set([].concat(ids).filter(Boolean))];
      const now = Date.now(), need = list.filter(i => !pcache.has(i) || now - pcache.get(i).t > 300000);
      if (need.length) {
        const key = need.sort().join(",");
        if (!pinflight.has(key)) pinflight.set(key, sb.rpc("get_profiles", { ids: need }).then(({ data }) => {
          const got = new Set();
          (data || []).forEach(p => { got.add(p.id); pcache.set(p.id, { t: Date.now(), p: { id: p.id, name: p.name || "", avatarUrl: avatar(p.name, p.id), isMe: p.id === session.user.id, guest: false } }); });
          need.forEach(i => { if (!got.has(i)) pcache.set(i, { t: Date.now(), p: { id: i, name: "", avatarUrl: avatar("?", i), isMe: i === session.user.id, guest: false } }); });
        }).catch(() => {}).finally(() => pinflight.delete(key)));
        await pinflight.get(key);
      }
      const out = {};
      list.forEach(i => { out[i] = pcache.has(i) ? pcache.get(i).p : { id: i, name: "", avatarUrl: avatar("?", i), isMe: i === session.user.id, guest: false }; });
      return out;
    }
  };

  /* ---------- who's here now ---------- */
  const room = {
    _fns: [], _ch: null,
    onPeers(fn) {
      this._fns.push(fn);
      if (!this._ch) {
        const me = session.user.id;
        this._ch = sb.channel("nl-presence", { config: { presence: { key: me } } });
        this._ch.on("presence", { event: "sync" }, () => {
          const st = this._ch.presenceState();
          const peers = Object.keys(st).map(k => ({ peer: k, by: k, isMe: k === me, kind: "viewer", presence: {} }));
          this._fns.forEach(f => f({ peers }));
        }).subscribe(s => { if (s === "SUBSCRIBED") this._ch.track({ at: Date.now() }); });
      }
      return () => {};
    },
    presence: async () => {}
  };

  /* ---------- saving files (calendar) ---------- */
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: /\.ics$/i.test(filename) ? "text/calendar" : "application/octet-stream" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return { status: "saved" };
    }
  };

  const API = { db, user, room, downloads };

  /* ---------- leader tools: people and roles ---------- */
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw (error.code === "23505" ? { code: "exists", message: error.message } : (error.code === "22023" ? { code: "invalid", message: error.message } : mapErr(error))); return data; };
  window.NL_ADMIN = {
    role: () => profile && profile.role,
    async list() { const { data, error } = await sb.from("people").select("id,user_id,email,name,role,kind,claim_code,created_at").order("created_at"); if (error) throw mapErr(error); return data; },
    invite: (email, name, role) => rpc("invite_person", { p_email: email, p_name: name, p_role: role }),
    async setRole(id, role) { const { error } = await sb.from("people").update({ role }).eq("id", id); if (error) throw mapErr(error); },
    remove: id => rpc("remove_person", { p_id: id }),
    resetLogin: id => rpc("reset_login", { p_id: id }),
    getCode: () => rpc("get_community_code"),
    setCode: c => rpc("set_community_code", { p_code: c })
  };
  /* ---------- show/hide password (eye button) ---------- */
  const EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.6 17.6 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>';
  function addEyes(root) {
    root.querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
      inp.dataset.eye = "1";
      const wrap = document.createElement("span"); wrap.className = "pw";
      inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
      const b = document.createElement("button");
      b.type = "button"; b.className = "eye"; b.innerHTML = EYE;
      b.setAttribute("aria-label", "Show password"); b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => {
        const show = inp.type === "password";
        inp.type = show ? "text" : "password";
        b.innerHTML = show ? EYE_OFF : EYE;
        b.setAttribute("aria-label", show ? "Hide password" : "Show password");
        b.setAttribute("aria-pressed", String(show));
        inp.focus({ preventScroll: true });
      });
      wrap.appendChild(b);
    });
  }
  new MutationObserver(() => addEyes(gate)).observe(gate, { childList: true, subtree: true });
  addEyes(gate);

  /* ---------- files and flyers (Supabase Storage, bucket "attachments") ---------- */
  window.NL_FILES = {
    async upload(blob, folder, name, type) {
      const safe = String(name || "file").toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(-60) || "file";
      const path = folder + "/" + newId() + "-" + safe;
      const bucket = sb.storage.from("attachments");
      const { error } = await bucket.upload(path, blob, { contentType: type || blob.type || "application/octet-stream", cacheControl: "31536000", upsert: false });
      if (error) throw error;
      return { path, url: bucket.getPublicUrl(path).data.publicUrl };
    },
    async remove(paths) { const list = [].concat(paths || []).filter(Boolean); if (list.length) await sb.storage.from("attachments").remove(list); }
  };

  /* ---------- notifications on this device ---------- */
  const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const keyBytes = k => { const t = k.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(t + "===".slice((t.length + 3) % 4)), c => c.charCodeAt(0)); };
  const sameKey = (buf, k) => { if (!buf) return true; const a = new Uint8Array(buf), b = keyBytes(k); return a.length === b.length && a.every((x, i) => x === b[i]); };
  let pushKey = null;
  async function callPush(body) { const { data, error } = await sb.functions.invoke("push", { body }); if (error) throw error; return data; }
  window.NL_PUSH = {
    supported: () => !isNative() && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window,
    // iPhone/iPad in Safari: notifications only work once the app is on the Home Screen.
    needsHomeScreen: () => !isNative() && /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !("PushManager" in window),
    permission: () => ("Notification" in window ? Notification.permission : "unsupported"),
    async isOn() {
      if (!window.NL_PUSH.supported() || Notification.permission !== "granted") return false;
      try { const r = await navigator.serviceWorker.ready; return !!(await r.pushManager.getSubscription()); } catch (e) { return false; }
    },
    // Asks permission (only prompts the first time) and registers this device.
    async enable() {
      const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
      if (perm !== "granted") return perm;
      if (!pushKey) { const d = await callPush({ action: "key" }); if (!d || !d.key) throw new Error("no_key"); pushKey = d.key; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (sub && !sameKey(sub.options && sub.options.applicationServerKey, pushKey)) { await sub.unsubscribe(); sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
      const j = sub.toJSON();
      const { error } = await sb.rpc("save_push_sub", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_platform: "web" });
      if (error) throw mapErr(error);
      return "granted";
    },
    async disable(localOnly) {
      try {
        if (!("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.getRegistration("/"); const s = reg && await reg.pushManager.getSubscription();
        if (s) { if (!localOnly) await sb.from("push_subs").delete().eq("endpoint", s.endpoint); await s.unsubscribe(); }
      } catch (e) {}
    },
    test: () => callPush({ action: "test" }),
    notifyPost: (col, id) => callPush({ action: "post", col, id }),
    alertLeaders: (kind, ref) => callPush({ action: "alert", kind, ref })
  };
  if (!isNative() && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.nav) { const u = new URL(e.data.nav); if (u.hash && u.hash !== location.hash) location.hash = u.hash; } });
  }

  window.NL_ACCOUNT = {
    email: () => session && session.user.email,
    kind: () => profile && profile.kind,
    name: () => profile && profile.name,
    async setName(n) { await sb.rpc("set_my_name", { new_name: n }); profile.name = n.trim(); LS.set("name", profile.name); },
    signOut: async () => { await window.NL_PUSH.disable(); return sb.auth.signOut(); },
    async deleteAccount() { try { await sb.from("docs").delete().eq("collection", "comments").eq("id", session.user.id); } catch (e) {} const { data, error } = await sb.rpc("delete_my_account"); if (error) throw mapErr(error); if (data === "ok") { try { localStorage.removeItem("nl.name"); } catch (e) {} await window.NL_PUSH.disable(true); await sb.auth.signOut(); } return data; }
  };
  window.NL_SITE_URL = siteUrl;

  /* ---------- start up ---------- */
  let booted = false;
  async function boot() {
    const s = (await sb.auth.getSession()).data.session;
    session = s;
    if (!session) { joinScreen(); return; }
    const { data, error } = await sb.rpc("my_profile");
    if (error) { joinScreen("Couldn't load your account. Check your internet and try again."); return; }
    profile = (data && data[0]) || null;
    const anon = !!session.user.is_anonymous || !session.user.email;
    if (!profile || profile.role === "pending") { if (anon) joinScreen(); else pendingScreen(); return; }
    hideGate();
    if (!booted) { booted = true; resolveReady(true); }
  }

  function start() {
    if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) { setupScreen(); resolveReady(false); return; }
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    let lastUser = null;
    sb.auth.onAuthStateChange((event, s) => {
      const uid = s && s.user && s.user.id;
      // Once inside the app, signing out (or switching account) reloads to the welcome screen.
      if (booted && (event === "SIGNED_OUT" || (uid && lastUser && uid !== lastUser))) { location.replace(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? location.pathname : siteUrl()); return; }
      lastUser = uid || lastUser;
    });
    boot();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
const DOWC=["SU","MO","TU","WE","TH","FR","SA"];
const icsDT=(d,t)=>d.replace(/-/g,"")+"T"+(t||"00:00").replace(":","")+"00";
function vevent(o){const L=["BEGIN:VEVENT","UID:"+o.uid+"@nextlevel","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"];
  if(o.time){L.push("DTSTART:"+icsDT(o.date,o.time),"DTEND:"+icsDT(o.date,o.end||(pad((Number(o.time.slice(0,2))+1)%24)+o.time.slice(2))))}
  else L.push("DTSTART;VALUE=DATE:"+o.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+ymd(addD(pd(o.date),1)).replace(/-/g,""));
  if(o.rrule)L.push("RRULE:"+o.rrule);L.push("SUMMARY:"+icsEsc(o.title));if(o.where)L.push("LOCATION:"+icsEsc(o.where));if(o.desc)L.push("DESCRIPTION:"+icsEsc(o.desc));
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(o.title),"TRIGGER:"+(o.time?"-PT2H":"-PT15H"),"END:VALARM","END:VEVENT");return L.join("\r\n")}
function rhythmEvent(r){let s=pd(r.from)||today();if(s<today())s=today();let d=s;
  for(let i=0;i<70;i++){const x=addD(s,i);if(x.getDay()===Number(r.dow)&&(r.freq!=="first"||x.getDate()<=7)&&!(r.freq==="weekly"&&r.skipFirst&&x.getDate()<=7)){d=x;break}}
  const c=DOWC[r.dow];let rule=r.freq==="first"?"FREQ=MONTHLY;BYDAY=1"+c:(r.skipFirst?"FREQ=MONTHLY;BYDAY=2"+c+",3"+c+",4"+c+",5"+c:"FREQ=WEEKLY;BYDAY="+c);
  if(r.to)rule+=";UNTIL="+r.to.replace(/-/g,"")+"T235959";return {uid:"r-"+r.id,date:ymd(d),time:r.time,end:r.end,title:r.title,where:r.where,desc:r.desc,rrule:rule}}
function icsIds(){return S.col.rhythm.map(r=>"r-"+r.id).concat(S.col.events.filter(e=>e.date>=ymd(today())).map(e=>"e-"+e.id+"@"+e.date+(e.time||"")))}
function icsBtn(){const had=S.mine.icsIds;const all=icsIds();
  if(!had||!had.length)return `<button class="btn ghost small" style="align-self:flex-start" data-act="ics" data-k="all">${ic("cal")} Add everything to my phone calendar</button>`;
  const fresh=all.filter(i=>!had.includes(i)).length;
  if(!fresh)return `<p class="hint ics-done">${ic("check",2)} Everything is in your phone calendar. If something new is added, a button will appear here.</p>`;
  return `<button class="btn ghost small" style="align-self:flex-start" data-act="ics" data-k="new">${ic("cal")} Add ${fresh} new ${fresh===1?"date":"dates"} to my phone calendar</button>`}
async function exportICS(which){
  const ev=[];
  const done=which==="all"||which==="new";const had=which==="new"?(S.mine.icsIds||[]):[];
  if(done){S.col.rhythm.forEach(r=>{if(!had.includes("r-"+r.id))ev.push(vevent(rhythmEvent(r)))});S.col.events.filter(e=>e.date>=ymd(today())).forEach(e=>{if(!had.includes("e-"+e.id+"@"+e.date+(e.time||"")))ev.push(vevent({uid:"e-"+e.id,...e,desc:(e.tbc?"Date to be confirmed. ":"")+(e.desc||"")}))})}
  else if(which.startsWith("r:")){const r=S.col.rhythm.find(x=>x.id===which.slice(2));if(r)ev.push(vevent(rhythmEvent(r)))}
  else if(which.startsWith("e:")){const e=S.col.events.find(x=>x.id===which.slice(2));if(e)ev.push(vevent({uid:"e-"+e.id,...e}))}
  if(!ev.length){toast("Nothing to add yet.");return}
  const body="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Next Level//Community App//EN\r\nCALSCALE:GREGORIAN\r\nX-WR-CALNAME:Next Level\r\n"+ev.join("\r\n")+"\r\nEND:VCALENDAR\r\n";
  if(!S.dl){toast("Calendar files can't be saved from this view.");return}
  try{await S.dl.save({filename:which==="all"?"next-level-calendar.ics":"next-level-event.ics",data:body});toast("Saved. Open the file to add it to your calendar with alerts.")}
  catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rejected_extension"?"This viewer won't save calendar files.":"Couldn't save the calendar file.")}
}

function shrinkImage(file,max,q){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type)){res(null);return}
  const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    if(k===1&&file.size<1500000&&max>1000){URL.revokeObjectURL(url);res(null);return}
    const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);

  if(/^image\/(jpeg|png|webp)$/.test(type)){const th=await shrinkImage(main,900,.8);if(th){const t=await F.upload(th,col,base+"-small.jpg","image/jpeg");out.thumb=t.url;out.thumbPath=t.path}}

function jotGet(id){if(id&&id.startsWith("s-")){const nid=id.slice(2);const n=S.col.notes.find(x=>x.id===nid);return {id,kind:"sermon",title:n?n.title:"Session notes",body:(S.mine.notes||{})[nid]||"",sess:nid,date:n&&n.date||"",virtual:true,series:n&&n.series||""}}return (S.mine.book||{})[id]||null}

     <label class="btn quiet small upl">${ic("plus",2)} Add a flyer or file<input type="file" id="ef-file" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"></label>
     <span class="hint" style="font-weight:500">Images, PDFs and documents up to 20 MB. Members can open and share them, and anyone they send a file to can see it.</span></div>`:""}
   ${!id&&NOTIFY_COLS.includes(col)?`<label class="cb"><input type="checkbox" id="ef-notify" checked> Send a notification to everyone's phones</label>`:""}

let files=(cur.files||[]).slice(),removed=[],busy=0;
    const fl=r.querySelector("#ef-files"),sub=r.querySelector('#ef button[type=submit]');
    const drawFiles=()=>{if(!fl)return;fl.innerHTML=files.map((f,i)=>`<div class="ef-file">${f.uploading?'<span class="spin"></span>':isImg(f)?`<img src="${esc(f.thumb||f.url)}" alt="">`:ic("notes")}<span><b>${esc(f.name)}</b><small${f.missing?' style="color:var(--bad)"':""}>${f.uploading?"Uploading…":f.missing?"Needs adding again. Remove it, then add the file back":fkind(f)+(f.size?" · "+fsize(f.size):"")}</small></span>${f.uploading?"":`<button type="button" class="btn quiet small ef-rm" data-rm="${i}" aria-label="Remove ${esc(f.name)}">Remove</button>`}</div>`).join("");
      sub.disabled=busy>0;sub.textContent=busy?"Uploading…":(id?"Save":"Publish")};
    drawFiles();
    if(fl)fl.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;const f=files.splice(Number(b.dataset.rm),1)[0];if(f)removed.push(...filePaths([f]));drawFiles()});
    const inp=r.querySelector("#ef-file");
    if(inp)inp.addEventListener("change",async()=>{const picked=[...inp.files];inp.value="";
      for(const file of picked){const ph={name:file.name,uploading:true};files.push(ph);busy++;drawFiles();
        try{const done=await uploadOne(file,col);files[files.indexOf(ph)]=done}catch(err){files.splice(files.indexOf(ph),1);toast(err&&/big/.test(err.message)?file.name+" is over 20 MB":"Couldn't upload "+file.name)}

        const nf=r.querySelector("#ef-notify"),notify=!!(nf&&nf.checked);
        let ref=null;if(id)await setDoc(col+"/"+id,body);else{ref=await addDoc(col,body);if(notify&&ref&&ref.id&&NP())NP().notifyPost(col,ref.id).then(x=>toast(x&&x.sent?`Notification sent to ${x.sent} device${x.sent===1?"":"s"}`:"Published. No one has notifications on yet.")).catch(()=>toast("Published, but the notification didn't send"))}
        if(removed.length&&window.NL_FILES)NL_FILES.remove(removed).catch(()=>{});
        closeSheet();toast(id?"Saved":"Published. Everyone sees it now.");
        if(!id){const nid=ref&&ref.id;const go={notes:nid?"notes-"+nid:"notes",events:nid?"event-"+nid:"events",announcements:"news",posts:"news",celebrations:"news",opps:"opportunities",prayerwall:"prayer",rhythm:"calendar"}[col];
          if(go){if(location.hash==="#"+go)window.dispatchEvent(new HashChangeEvent("hashchange"));else location.hash=go}}}catch(e){}
    });
  });
}

  const NOTIFY={announcements:a=>"New announcement: "+(a.title||String(a.body||"").slice(0,40)),events:e=>"New event: "+e.title};
  COLS.forEach(c=>{try{db.collection(c).onSnapshot(s=>{
    S.col[c]=s.docs.map(x=>Object.assign({id:x.id},x.data()));
    if(!s.metadata.fromCache){S.loaded.add(c);clearTimeout(timer);S.timedOut=false}
    if(first.has(c)&&NOTIFY[c]&&!s.metadata.hasPendingWrites)s.docChanges().filter(ch=>ch.type==="added").forEach(ch=>toast(NOTIFY[c](ch.doc.data()||{})));
    first.add(c);render()},()=>{clearTimeout(timer);render()})}catch(e){}});
  SELF.forEach(c=>{try{db.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());
    if(S.uid&&s.metadata.hasPendingWrites&&S.self[c][S.uid]&&!m[S.uid])m[S.uid]=S.self[c][S.uid];S.self[c]=m;render()},()=>{})}catch(e){}});
  if(S.uid){try{db.doc("data/users/"+S.uid+"/me").onSnapshot(s=>{if(!mineT){const d=s.exists?(s.data()||{}):{};S.mine={remind:Object.assign({},d.remind||{}),notes:Object.assign({},d.notes||{}),book:Object.assign({},d.book||{}),icsIds:Array.isArray(d.icsIds)?d.icsIds.slice():[],teams:(d.teams||[]).slice(),onboarded:!!d.onboarded,seenAt:Number(d.seenAt||0),leaderAlerts:d.leaderAlerts!==false,notify:Object.assign({},d.notify||{})}}
      if(!s.metadata.fromCache)S.mineLoaded=true;render()},()=>{S.mineLoaded=true})}catch(e){}}
  if(room){try{room.onPeers(ch=>{S.peers=ch.peers||[];renderOnline()});room.presence({here:true}).catch(()=>{})}catch(e){S.room=null}}
})();
})();
</script>
